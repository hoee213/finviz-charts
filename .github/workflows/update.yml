name: Update Finviz Charts

on:
  schedule:
    # 1차: 21:30 UTC = 익일 06:30 KST (Mon-Fri KST = Sun-Thu UTC)
    - cron: "30 21 * * 0-4"
    # 2차 백업: 22:30 UTC = 익일 07:30 KST
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download charts & generate site
        run: python update.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
          commit_message: "update charts ${{ github.run_id }}"
