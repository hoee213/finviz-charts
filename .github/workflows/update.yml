name: Update Finviz Charts

on:
  schedule:
    # GitHub 스케줄이 예약보다 2~4.5시간 늦게 도는 실측(2026-09) 때문에 앞당기고,
    # 혼잡한 정각·30분을 피해 분 단위를 비껴 둔다. 마지막 실행이 덮어쓰므로 여러 번 돌아도 무방.
    # 05:47 KST (미국장 마감 05:00 KST 직후, 서머타임 기준)
    - cron: "47 20 * * 0-4"
    # 06:07 KST
    - cron: "7 21 * * 0-4"
    # 06:37 KST
    - cron: "37 21 * * 0-4"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download charts & generate site
        run: python update.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
          commit_message: "update charts ${{ github.run_id }}"
